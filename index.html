<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Homepage Layout - YIU TING MAK</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER BLOCK: two dark full-width rows at the top of the page, the top nav and the sub nav -->
<div class="header">

    <!-- TOP NAV BLOCK: dark row holding the logo, the delivery address, the search bar and the account links -->
    <div class="top-nav">

        <!-- LOGO BLOCK: floated left, the first item on the row -->
        <div class="site-logo">
            <img src="img/logo.png" alt="Amazon logo">
        </div>
        <!-- LOGO BLOCK END -->

        <!-- DELIVERY BLOCK: floated left, sits next to the logo -->
        <div class="deliver-block">
            <p class="deliver-small">Deliver to</p>
            <p class="deliver-big">Hong Kong</p>
        </div>
        <!-- DELIVERY BLOCK END -->

        <!-- SEARCH BLOCK: floated left, holds the scope list, the text box and the search button -->
        <div class="search-bar">
            <div class="search-scope">All</div>
            <input class="search-input" type="text" value="">
            <div class="search-button">Search</div>
        </div>
        <!-- SEARCH BLOCK END -->

        <!-- ACCOUNT BLOCK: floated right, holds the sign in links and the cart -->
        <div class="account-links">
            <div class="account-item">Hello, sign in</div>
            <div class="account-item">Returns &amp; Orders</div>
            <div class="cart-item">Cart</div>
        </div>
        <!-- ACCOUNT BLOCK END -->

    </div>
    <!-- TOP NAV BLOCK END -->

    <!-- SUB NAV BLOCK: second dark row, a list of category links laid out with display inline-block -->
    <div class="sub-nav">
        <ul class="sub-nav-list">
            <li><a href="#">All</a></li>
            <li><a href="#">Today's Deals</a></li>
            <li><a href="#">Customer Service</a></li>
            <li><a href="#">Registry</a></li>
            <li><a href="#">Gift Cards</a></li>
            <li><a href="#">Sell</a></li>
        </ul>
    </div>
    <!-- SUB NAV BLOCK END -->

</div>
<!-- HEADER BLOCK END -->
<!-- MAIN BLOCK: grey page body, a fixed width column centred with margin: 0 auto -->
<div class="main-wrapper">

    <!-- BANNER BLOCK: wide image strip directly under the header -->
    <div class="hero-banner">
        <img src="img/banner.jpg" alt="Amazon banner">
    </div>
    <!-- BANNER BLOCK END -->

    <!-- CARD GRID BLOCK: four white category cards in one row, all four floated left -->
    <div class="card-grid">

        <!-- CARD BLOCK: one category card, floated left -->
        <div class="card">
            <h2 class="card-title">Shop for your home</h2>
            <img class="card-image" src="img/card1.jpg" alt="Home essentials">
            <a class="card-link" href="#">See more</a>
        </div>
        <!-- CARD BLOCK END -->

        <!-- CARD BLOCK: one category card, floated left -->
        <div class="card">
            <h2 class="card-title">Gaming accessories</h2>
            <img class="card-image" src="img/card2.jpg" alt="Gaming accessories">
            <a class="card-link" href="#">See more</a>
        </div>
        <!-- CARD BLOCK END -->

        <!-- CARD BLOCK: one category card, floated left -->
        <div class="card">
            <h2 class="card-title">Fashion deals</h2>
            <img class="card-image" src="img/card3.jpg" alt="Fashion deals">
            <a class="card-link" href="#">See more</a>
        </div>
        <!-- CARD BLOCK END -->

        <!-- CARD BLOCK: one category card, floated left -->
        <div class="card">
            <h2 class="card-title">Deals in PCs</h2>
            <img class="card-image" src="img/card4.jpg" alt="Deals in PCs">
            <a class="card-link" href="#">See more</a>
        </div>
        <!-- CARD BLOCK END -->

        <!-- CLEAR TAG: an empty tag after the four floated cards, this is the extra tag clearing method -->
        <div class="clear"></div>
        <!-- CLEAR TAG END -->

    </div>
    <!-- CARD GRID BLOCK END -->

    
</div>
<!-- MAIN BLOCK END -->

</body>
</html>
